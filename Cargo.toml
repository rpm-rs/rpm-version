[package]
name = "rpm-version"
version = "0.5.1"
edition = "2024"
description = "A library for dealing with RPM versions (NEVRA, EVR) correctly. Sort algorithm is identical to RPM."
license = "MIT"
authors = [
    "Daniel Alley <dalley@redhat.com>"
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
magnus = { version = "0.9.3", optional = true }

[dev-dependencies]
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8"

[[bench]]
name = "sort"
harness = false

[features]
default = []
python = ["pyo3/extension-module", "pyo3/abi3-py310"]
ruby = ["dep:magnus"]
serde = ["dep:serde"]

[[example]]
name = "serde"
required-features = ["serde"]
