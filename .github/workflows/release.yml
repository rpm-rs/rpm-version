name: Release

on:
  push:
    tags: ['v*']  # Triggers when pushing tags starting with 'v'

jobs:
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: PyO3/maturin-action@v1
        with:
          args: --compatibility pypi --release --out dist
          manylinux: 2_28
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  build-rubygem:
    name: Build RubyGem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: dtolnay/rust-toolchain@stable
      - run: mkdir -p dist
      - run: gem build rpm-version.gemspec --output dist/rpm-version.gem
      - name: Install and smoke-test the gem
        env:
          GEM_HOME: ${{ runner.temp }}/rpm-version-gems
          GEM_PATH: ${{ runner.temp }}/rpm-version-gems
        run: |
          mkdir -p "$GEM_HOME"
          gem install --no-document dist/rpm-version.gem
          ruby -e 'require "rpm_version"; abort unless RPMVersion.evr_compare("1.0-1", "2.0-1") == -1'
      - uses: actions/upload-artifact@v7
        with:
          name: rubygem
          path: dist/*.gem

  publish-rubygems:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    needs: [build-rubygem]
    environment: Release
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v8
        with:
          name: rubygem
          path: dist/
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push dist/rpm-version.gem

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment: Release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
